<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Asistencia</title>
    <style>
        :root {
            --primary-color: #d4af37; /* Dorado */
            --bg-color: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-family: 'Georgia', serif;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Estilo de los selectores (barras desplazadoras) */
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #diet-details-container {
            display: none; /* Oculto por defecto */
            margin-top: 15px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        button:hover {
            background-color: #b8962e;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Confirmar Asistencia</h1>
    
    <form action="https://formspree.io/f/mojybzky" method="POST">
        <div class="input-group">
            <label for="name">Nombre y Apellido</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre completo" required>
        </div>

        <div class="input-group">
            <label for="attendance">¿Vas a venir?</label>
            <select id="attendance" name="attendance">
                <option value="si">¡Sii re estoy!</option>
                <option value="no">No voy a poder</option>
            </select>
        </div>

        <div class="input-group">
            <label for="hasDiet">¿Tenés dietas especiales?</label>
            <select id="hasDiet" name="hasDiet" onchange="toggleDietDetails()">
                <option value="no">No</option>
                <option value="si">Sí</option>
            </select>
        </div>

        <div id="diet-details-container" class="input-group">
            <label for="dietDetails">Contanos cuáles:</label>
            <textarea id="dietDetails" name="dietDetails" rows="3"></textarea>
        </div>

        <button type="submit">Enviar respuesta</button>
    </form>

</div>

<script>
    function toggleDietDetails() {
        const dietSelect = document.getElementById('hasDiet');
        const detailsContainer = document.getElementById('diet-details-container');
        
        if (dietSelect.value === 'si') {
            detailsContainer.style.display = 'block';
        } else {
            detailsContainer.style.display = 'none';
        }
    }

    // Opcional: Manejo del envío
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('¡Gracias por confirmar! Tu respuesta ha sido enviada.');
    });
</script>

</body>
</html>
